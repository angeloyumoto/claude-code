<style>
  :root {
    --ink: #1a1a1a;
    --muted: #6b6b6b;
    --line: #d9d9d9;
    --accent: #0b7a3b;
    --accent-dark: #085c2c;
    --bg: #f6f6f4;
    --card: #ffffff;
    --error: #b3261e;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    padding: 16px 16px 48px;
    max-width: 480px;
    margin: 0 auto;
  }
  h1 {
    font-size: 1.25rem;
    padding: 8px 0 4px;
  }
  .sub {
    color: var(--muted);
    font-size: 0.9rem;
    margin-bottom: 16px;
  }
  form {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 16px;
  }
  .field { margin-bottom: 16px; }
  label {
    display: block;
    font-weight: 600;
    font-size: 0.95rem;
    margin-bottom: 4px;
  }
  .hint {
    color: var(--muted);
    font-size: 0.8rem;
    margin-bottom: 6px;
  }
  input[type="text"], textarea, select {
    width: 100%;
    font-size: 1rem;
    padding: 12px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: #fff;
    color: var(--ink);
    appearance: none;
    -webkit-appearance: none;
  }
  input:focus, textarea:focus, select:focus {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
    border-color: var(--accent);
  }
  textarea { resize: vertical; min-height: 72px; }
  .optional { font-weight: 400; color: var(--muted); font-size: 0.85rem; }
  button {
    width: 100%;
    font-size: 1.05rem;
    font-weight: 700;
    padding: 14px;
    border: none;
    border-radius: 10px;
    background: var(--accent);
    color: #fff;
  }
  button:active { background: var(--accent-dark); }
  button:disabled { opacity: 0.6; }
  #status {
    margin-top: 12px;
    padding: 12px;
    border-radius: 8px;
    font-size: 0.95rem;
    display: none;
  }
  #status.ok { display: block; background: #e6f4ea; color: #0b5c2c; }
  #status.err { display: block; background: #fbe9e7; color: var(--error); }
  #otherFilmedWrap { display: none; margin-top: 8px; }
</style>

<h1>Kahawa Pride: log a shoot</h1>
<p class="sub">One form per shoot: a day, a place, a match, an event you filmed. Takes under a minute.</p>

<form id="shootForm" onsubmit="return false;">
  <div class="field">
    <label for="when">When</label>
    <p class="hint">A week is fine if you do not remember the exact day.</p>
    <input type="text" id="when" placeholder="2nd week of July 2026, or 14 July 2026" autocomplete="off">
  </div>

  <div class="field">
    <label for="contentName">Name of the content</label>
    <p class="hint">In your own words, what did you film? Not an episode name.</p>
    <input type="text" id="contentName" placeholder="Kamongo away day, Tabitha training, clubhouse tour" autocomplete="off" required>
  </div>

  <div class="field">
    <label for="place">Place</label>
    <input type="text" id="place" placeholder="Kamongo, Vision grounds" autocomplete="off">
  </div>

  <div class="field">
    <label for="eventOrMatch">Event or match</label>
    <input type="text" id="eventOrMatch" placeholder="Kamongo away, league" autocomplete="off">
  </div>

  <div class="field">
    <label for="whoFilmed">Who filmed</label>
    <select id="whoFilmed">
      <? for (var i = 0; i < crewNames.length; i++) { ?>
        <option value="<?= crewNames[i] ?>"><?= crewNames[i] ?></option>
      <? } ?>
      <option value="__other__">Someone else</option>
    </select>
    <div id="otherFilmedWrap">
      <input type="text" id="otherFilmed" placeholder="Name" autocomplete="off">
    </div>
  </div>

  <div class="field">
    <label for="driveLinks">Drive link or links</label>
    <p class="hint">Paste one or more links, one per line.</p>
    <textarea id="driveLinks" placeholder="https://drive.google.com/..." required></textarea>
  </div>

  <div class="field">
    <label for="note">Note <span class="optional">(optional)</span></label>
    <input type="text" id="note" placeholder="Anything the editor should know" autocomplete="off">
  </div>

  <button id="sendBtn" type="button" onclick="send()">Send</button>
  <div id="status" role="status"></div>
</form>

<script>
  var LINK_KEY = <?!= JSON.stringify(linkKey) ?>;

  var whoSelect = document.getElementById('whoFilmed');
  var otherWrap = document.getElementById('otherFilmedWrap');
  whoSelect.addEventListener('change', function () {
    otherWrap.style.display = whoSelect.value === '__other__' ? 'block' : 'none';
  });

  function val(id) {
    return document.getElementById(id).value.trim();
  }

  function showStatus(kind, text) {
    var box = document.getElementById('status');
    box.className = kind;
    box.textContent = text;
    box.style.display = kind ? 'block' : 'none';
  }

  function send() {
    var name = val('contentName');
    var links = val('driveLinks');
    if (!name) {
      showStatus('err', 'Please add a name for what you shot.');
      return;
    }
    if (!links) {
      showStatus('err', 'Please paste at least one Drive link.');
      return;
    }

    var who = whoSelect.value === '__other__' ? val('otherFilmed') : whoSelect.value;

    var btn = document.getElementById('sendBtn');
    btn.disabled = true;
    btn.textContent = 'Sending...';
    showStatus('', '');

    google.script.run
      .withSuccessHandler(function (res) {
        btn.disabled = false;
        btn.textContent = 'Send';
        if (res && res.ok) {
          resetForNextShoot();
          showStatus('ok', 'Sent. Logged and safe. Fill it again for the next shoot.');
        } else {
          showStatus('err', (res && res.message) || 'Could not send. Please try again.');
        }
      })
      .withFailureHandler(function () {
        btn.disabled = false;
        btn.textContent = 'Send';
        showStatus('err', 'Could not send. Check your connection and try again.');
      })
      .submitShoot({
        linkKey: LINK_KEY,
        when: val('when'),
        contentName: name,
        place: val('place'),
        eventOrMatch: val('eventOrMatch'),
        whoFilmed: who,
        driveLinks: links,
        note: val('note')
      });
  }

  function resetForNextShoot() {
    // Keep When and Who filmed, the same person often logs several shoots
    // from the same week in one sitting.
    ['contentName', 'place', 'eventOrMatch', 'driveLinks', 'note', 'otherFilmed']
      .forEach(function (id) { document.getElementById(id).value = ''; });
    window.scrollTo(0, 0);
  }
</script>
